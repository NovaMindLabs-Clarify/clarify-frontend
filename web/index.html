<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Планировщик задач с AI-ассистентом и командной работой.">
  <meta name="theme-color" content="#F6F6FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A10" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Clarify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clarify</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Без этого сброса body сохраняет UA-дефолтный margin (обычно 8px) —
       на мобильном это видно как белую плашку сверху под статус-баром,
       т.к. Flutter не рисует в safe-area, а под ней остаётся голый body. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F6F6FB;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0A0A10; }
    }

    /* Логотип-заглушка на время загрузки движка Flutter (main.dart.js/wasm) —
       до первого кадра тут иначе голый цвет фона, см. flutter_bootstrap.js
       (снимается коллбэком onEntrypointLoaded после runApp()). */
    @font-face {
      font-family: 'Unbounded';
      src: url('assets/assets/fonts/Unbounded-Variable.ttf') format('truetype');
      font-weight: 700;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.02em;
      color: #4F46E5;
      transition: opacity 0.25s ease-out;
    }
    @media (prefers-color-scheme: dark) {
      #app-loading { color: #818CF8; }
    }
    @media (prefers-reduced-motion: no-preference) {
      #app-loading span { animation: app-loading-pulse 1.4s ease-in-out infinite; }
    }
    @keyframes app-loading-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="app-loading"><span>Clarify</span></div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
